name: Godot Core Tests

on:
  push:
    branches:
      - main
      - 'feat/**'
  pull_request:

concurrency:
  group: core-tests-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  core-tests:
    runs-on: ubuntu-latest
    container:
      image: barichello/godot-ci:4.4
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Godot version
        run: godot --version

      - name: Solver smoke tests
        run: godot --headless --path . --script tests/core_solver_smoke.gd

      - name: Dependency solver equivalence
        run: godot --headless --path . --script tests/dependency_solver_equivalence.gd

      - name: Generator and validator smoke tests
        run: godot --headless --path . --script tests/generator_smoke.gd
