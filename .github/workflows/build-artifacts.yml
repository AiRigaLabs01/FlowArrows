name: Build Playable Artifacts

on:
  push:
    branches:
      - main
      - 'feat/**'
  pull_request:

permissions:
  contents: read

jobs:
  windows:
    name: Windows EXE
    runs-on: ubuntu-24.04
    container:
      image: barichello/godot-ci:4.4
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Prepare export templates
        run: |
          mkdir -p ~/.local/share/godot/export_templates
          mv /root/.local/share/godot/export_templates/4.4.stable ~/.local/share/godot/export_templates/4.4.stable

      - name: Build Windows
        run: |
          mkdir -p build/windows
          godot --headless --verbose --export-release "Windows Desktop" "$(pwd)/build/windows/FlowArrows.exe"

      - name: Upload Windows artifact
        uses: actions/upload-artifact@v6
        with:
          name: FlowArrows-Windows
          path: build/windows
          if-no-files-found: error
          retention-days: 14

  android:
    name: Android APK
    runs-on: ubuntu-24.04
    container:
      image: barichello/godot-ci:4.4
    env:
      ANDROID_HOME: /usr/lib/android-sdk
      ANDROID_SDK_ROOT: /usr/lib/android-sdk
      JAVA_HOME: /usr/lib/jvm/java-17-openjdk-amd64
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Diagnose Godot and export templates
        run: |
          echo '=== Godot version ==='
          godot --version
          echo '=== Original export template tree ==='
          find /root/.local/share/godot/export_templates -maxdepth 2 -type f -printf '%p\n' | sort || true
          echo '=== Project export preset ==='
          cat export_presets.cfg

      - name: Prepare export templates
        run: |
          mkdir -p ~/.local/share/godot/export_templates
          mv /root/.local/share/godot/export_templates/4.4.stable ~/.local/share/godot/export_templates/4.4.stable
          echo '=== Installed export templates ==='
          find ~/.local/share/godot/export_templates/4.4.stable -maxdepth 1 -type f -printf '%f %s bytes\n' | sort
          test -f ~/.local/share/godot/export_templates/4.4.stable/android_debug.apk
          test -f ~/.local/share/godot/export_templates/4.4.stable/android_release.apk

      - name: Verify Java
        run: |
          echo '=== Java paths ==='
          echo "JAVA_HOME=$JAVA_HOME"
          command -v java
          command -v keytool
          readlink -f "$(command -v java)"
          test -x "$JAVA_HOME/bin/java"
          test -x "$JAVA_HOME/bin/keytool"
          "$JAVA_HOME/bin/java" -version
          "$JAVA_HOME/bin/javac" -version

      - name: Install complete Godot 4.4 Android toolchain
        run: |
          yes | sdkmanager --sdk_root="$ANDROID_HOME" --licenses >/dev/null
          sdkmanager --sdk_root="$ANDROID_HOME" \
            "platform-tools" \
            "build-tools;34.0.0" \
            "platforms;android-34" \
            "cmdline-tools;latest" \
            "cmake;3.10.2.4988404" \
            "ndk;23.2.8568313"

          echo '=== Android environment ==='
          echo "ANDROID_HOME=$ANDROID_HOME"
          echo "ANDROID_SDK_ROOT=$ANDROID_SDK_ROOT"
          echo '=== Relevant SDK directories ==='
          find "$ANDROID_HOME" -maxdepth 2 -type d | sort | grep -E 'build-tools|platforms|platform-tools|cmdline-tools|cmake|ndk' || true
          echo '=== Installed SDK packages ==='
          sdkmanager --sdk_root="$ANDROID_HOME" --list_installed || true

          test -x "$ANDROID_HOME/platform-tools/adb"
          test -x "$ANDROID_HOME/build-tools/34.0.0/aapt2"
          test -x "$ANDROID_HOME/build-tools/34.0.0/apksigner"
          test -d "$ANDROID_HOME/cmdline-tools/latest"
          test -d "$ANDROID_HOME/cmake/3.10.2.4988404"
          test -d "$ANDROID_HOME/ndk/23.2.8568313"

          echo '=== Tool versions ==='
          "$ANDROID_HOME/platform-tools/adb" version
          "$ANDROID_HOME/build-tools/34.0.0/aapt2" version
          "$ANDROID_HOME/build-tools/34.0.0/apksigner" version || true

      - name: Start ADB server for diagnostics
        run: |
          echo '=== ADB before start ==='
          "$ANDROID_HOME/platform-tools/adb" devices -l || true
          "$ANDROID_HOME/platform-tools/adb" start-server
          echo '=== ADB after start ==='
          "$ANDROID_HOME/platform-tools/adb" devices -l || true

      - name: Create Android debug keystore
        run: |
          mkdir -p ~/.android
          "$JAVA_HOME/bin/keytool" -genkeypair \
            -v \
            -keystore ~/.android/debug.keystore \
            -storepass android \
            -alias androiddebugkey \
            -keypass android \
            -keyalg RSA \
            -keysize 2048 \
            -validity 10000 \
            -dname "CN=Android Debug,O=Android,C=US"
          test -f ~/.android/debug.keystore
          echo '=== Debug keystore ==='
          ls -l ~/.android/debug.keystore
          "$JAVA_HOME/bin/keytool" -list -v \
            -keystore ~/.android/debug.keystore \
            -storepass android \
            -alias androiddebugkey | grep -E 'Alias name:|Entry type:|Certificate fingerprints:|SHA256:' || true

      - name: Create fresh Godot editor settings
        run: |
          rm -rf ~/.config/godot
          mkdir -p ~/.config/godot
          cat > ~/.config/godot/editor_settings-4.4.tres <<EOF
          [gd_resource type="EditorSettings" format=3]

          [resource]
          export/android/android_sdk_path = "$ANDROID_HOME"
          export/android/java_sdk_path = "$JAVA_HOME"
          export/android/debug_keystore = "/github/home/.android/debug.keystore"
          export/android/debug_keystore_user = "androiddebugkey"
          export/android/debug_keystore_pass = "android"
          export/android/force_system_user = false
          EOF
          echo '=== Editor settings before Godot ==='
          cat ~/.config/godot/editor_settings-4.4.tres

      - name: Let Godot normalize Android settings
        run: |
          mkdir -p build/android
          set +e
          godot --headless --editor --quit --path . --verbose > build/android/godot-editor-init.log 2>&1
          status=$?
          set -e
          cat build/android/godot-editor-init.log
          echo "Godot editor init exit code: $status"
          echo '=== Editor settings after Godot ==='
          cat ~/.config/godot/editor_settings-4.4.tres
          echo '=== Android-related normalized settings ==='
          grep -nE 'android|java|keystore|sdk|adb' ~/.config/godot/editor_settings-4.4.tres || true
          exit "$status"

      - name: Pre-export diagnostics
        run: |
          echo '=== File/path checks immediately before export ==='
          for path in \
            "$ANDROID_HOME" \
            "$JAVA_HOME" \
            "/github/home/.android/debug.keystore" \
            "/github/home/.local/share/godot/export_templates/4.4.stable/android_debug.apk"; do
            if [ -e "$path" ]; then
              echo "OK: $path"
            else
              echo "MISSING: $path"
            fi
          done
          echo '=== export_presets.cfg with line numbers ==='
          nl -ba export_presets.cfg
          echo '=== ADB status immediately before export ==='
          "$ANDROID_HOME/platform-tools/adb" devices -l || true

      - name: Build Android debug APK with captured log
        env:
          GODOT_ANDROID_KEYSTORE_DEBUG_PATH: /github/home/.android/debug.keystore
          GODOT_ANDROID_KEYSTORE_DEBUG_USER: androiddebugkey
          GODOT_ANDROID_KEYSTORE_DEBUG_PASSWORD: android
        run: |
          mkdir -p build/android
          echo '=== Starting Godot Android export ==='
          set +e
          godot --headless --verbose --path . --export-debug "Android Debug" "$(pwd)/build/android/FlowArrows-debug.apk" > build/android/godot-android-export.log 2>&1
          status=$?
          set -e
          cat build/android/godot-android-export.log
          echo "=== Godot export exit code: $status ==="
          echo '=== Focused diagnostics from export log ==='
          grep -niE 'error|warning|android|sdk|java|jdk|keystore|template|architecture|adb|export' build/android/godot-android-export.log || true
          echo '=== Output directory ==='
          find build/android -maxdepth 1 -type f -printf '%f %s bytes\n' | sort
          exit "$status"

      - name: Upload Android diagnostic log
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: FlowArrows-Android-Diagnostics
          path: |
            build/android/godot-editor-init.log
            build/android/godot-android-export.log
          if-no-files-found: warn
          retention-days: 14

      - name: Upload Android artifact
        uses: actions/upload-artifact@v6
        with:
          name: FlowArrows-Android
          path: build/android/FlowArrows-debug.apk
          if-no-files-found: error
          retention-days: 14
