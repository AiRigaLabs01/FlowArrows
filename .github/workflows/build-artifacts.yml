name: Build Playable Artifacts

on:
  push:
    branches:
      - main
      - 'feat/**'
  pull_request:

permissions:
  contents: read

jobs:
  windows:
    name: Windows EXE
    runs-on: ubuntu-24.04
    container:
      image: barichello/godot-ci:4.4
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Prepare export templates
        run: |
          mkdir -p ~/.local/share/godot/export_templates
          mv /root/.local/share/godot/export_templates/4.4.stable ~/.local/share/godot/export_templates/4.4.stable

      - name: Build Windows
        run: |
          mkdir -p build/windows
          godot --headless --verbose --export-release "Windows Desktop" "$(pwd)/build/windows/FlowArrows.exe"

      - name: Upload Windows artifact
        uses: actions/upload-artifact@v6
        with:
          name: FlowArrows-Windows
          path: build/windows
          if-no-files-found: error
          retention-days: 14

  android:
    name: Android APK
    runs-on: ubuntu-24.04
    container:
      image: barichello/godot-ci:4.4
    env:
      ANDROID_HOME: /usr/lib/android-sdk
      ANDROID_SDK_ROOT: /usr/lib/android-sdk
      JAVA_HOME: /usr/lib/jvm/java-17-openjdk-amd64
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Prepare export templates
        run: |
          mkdir -p ~/.local/share/godot/export_templates
          mv /root/.local/share/godot/export_templates/4.4.stable ~/.local/share/godot/export_templates/4.4.stable

      - name: Verify Java
        run: |
          test -x "$JAVA_HOME/bin/java"
          test -x "$JAVA_HOME/bin/keytool"
          "$JAVA_HOME/bin/java" -version

      - name: Install Android SDK 34
        run: |
          yes | sdkmanager --sdk_root="$ANDROID_HOME" --licenses >/dev/null
          sdkmanager --sdk_root="$ANDROID_HOME" \
            "platform-tools" \
            "platforms;android-34" \
            "build-tools;34.0.0"
          test -x "$ANDROID_HOME/platform-tools/adb"
          test -x "$ANDROID_HOME/build-tools/34.0.0/aapt2"

      - name: Create Android debug keystore
        run: |
          mkdir -p ~/.android
          "$JAVA_HOME/bin/keytool" -genkeypair \
            -v \
            -keystore ~/.android/debug.keystore \
            -storepass android \
            -alias androiddebugkey \
            -keypass android \
            -keyalg RSA \
            -keysize 2048 \
            -validity 10000 \
            -dname "CN=Android Debug,O=Android,C=US"
          test -f ~/.android/debug.keystore

      - name: Create fresh Godot editor settings
        run: |
          rm -rf ~/.config/godot
          mkdir -p ~/.config/godot
          cat > ~/.config/godot/editor_settings-4.4.tres <<EOF
          [gd_resource type="EditorSettings" format=3]

          [resource]
          export/android/android_sdk_path = "$ANDROID_HOME"
          export/android/java_sdk_path = "$JAVA_HOME"
          export/android/debug_keystore = "/github/home/.android/debug.keystore"
          export/android/debug_keystore_user = "androiddebugkey"
          export/android/debug_keystore_pass = "android"
          export/android/force_system_user = false
          EOF
          cat ~/.config/godot/editor_settings-4.4.tres

      - name: Verify Godot Android config
        run: |
          godot --headless --editor --quit --path . --verbose
          grep -E 'android_sdk_path|java_sdk_path|debug_keystore' ~/.config/godot/editor_settings-4.4.tres

      - name: Build Android debug APK
        run: |
          mkdir -p build/android
          godot --headless --verbose --export-debug "Android Debug" "$(pwd)/build/android/FlowArrows-debug.apk"

      - name: Upload Android artifact
        uses: actions/upload-artifact@v6
        with:
          name: FlowArrows-Android
          path: build/android/FlowArrows-debug.apk
          if-no-files-found: error
          retention-days: 14
